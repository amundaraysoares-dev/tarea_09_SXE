version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=
      - POSTGRES_USER=a
      - POSTGRES_PASSWORD=
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  web:
    image: odoo:19
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=
      - PASSWORD=
    depends_on:
      - db
    volumes:
      - odoo-web-data:/var/lib/odoo

pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user@domain.com
      PGADMIN_DEFAULT_PASSWORD: SuperSecret
   
    volumes:
      - pgadmin-data:/var/lib/pgadmin




volumes:
  odoo-db-data:
  odoo-web-data: